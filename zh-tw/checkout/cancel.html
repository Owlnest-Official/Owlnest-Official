<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>付款已取消 | Owlnest Official</title>
  <link rel="icon" type="image/png" href="/logo2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0b1221;
      --night-soft: #111827;
      --cream: #faefcf;
      --ivory: #fff7e6;
      --amber: #c89b5a;
      --muted: rgba(250, 239, 207, 0.72);
      --line: rgba(200, 155, 90, 0.28);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--night); }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 8%, rgba(200, 155, 90, 0.18), transparent 34%),
        radial-gradient(circle at 12% 88%, rgba(250, 239, 207, 0.08), transparent 30%),
        linear-gradient(145deg, var(--night) 0%, var(--night-soft) 52%, #070d18 100%);
      color: var(--cream);
      font-family: Manrope, Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }
    .status-card {
      width: min(100%, 620px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 247, 230, 0.105), rgba(255, 247, 230, 0.045));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 247, 230, 0.12);
      backdrop-filter: blur(18px) saturate(122%);
      -webkit-backdrop-filter: blur(18px) saturate(122%);
      padding: clamp(34px, 7vw, 54px);
      text-align: center;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: var(--ivory);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.26em;
    }
    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(250, 239, 207, 0.22);
      border-radius: 50%;
      background: rgba(255, 247, 230, 0.06);
    }
    .brand-mark img {
      display: block;
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .status-symbol {
      width: 48px;
      height: 48px;
      margin: 30px auto 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      position: relative;
      background: rgba(200, 155, 90, 0.09);
    }
    .status-symbol::before {
      content: "";
      position: absolute;
      left: 15px;
      right: 15px;
      top: 23px;
      height: 2px;
      background: var(--amber);
      transform: rotate(-28deg);
    }
    .kicker {
      margin: 22px 0 0;
      color: var(--amber);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 0;
      color: var(--ivory);
      font-family: "Noto Serif TC", "Microsoft JhengHei", Georgia, serif;
      font-size: clamp(32px, 7vw, 46px);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.12;
    }
    .message {
      max-width: 500px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }
    .button-row {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--amber);
      color: #0b1221;
      padding: 0 26px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 14px 34px rgba(200, 155, 90, 0.18);
      transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }
    .button:hover {
      background: var(--ivory);
      box-shadow: 0 16px 40px rgba(250, 239, 207, 0.16);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main>
    <section class="status-card" aria-labelledby="cancel-title">
      <div class="brand-lockup">
        <span class="brand-mark"><img src="/logo2.png" alt="Owlnest"></span>
        <span>OWLNEST</span>
      </div>
      <div class="status-symbol" aria-hidden="true"></div>
      <p class="kicker">付款已取消</p>
      <h1 id="cancel-title">付款已取消</h1>
      <p class="message">這次沒有完成預購付款。準備好時，可以回到產品頁重新預購。</p>
      <div class="button-row">
        <a href="/zh-tw/products/" class="button">回到產品頁</a>
      </div>
    </section>
  </main>
</body>
</html>

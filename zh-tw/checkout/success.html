<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>付款狀態 | Owlnest Official</title>
  <link rel="icon" type="image/png" href="/logo2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/consent.css">
  <style>
    :root {
      --night: #182234;
      --night-soft: #111d2f;
      --cream: #f7efd8;
      --ivory: #fff7e6;
      --amber: #c9852a;
      --muted: rgba(247, 239, 216, 0.74);
      --line: rgba(201, 133, 42, 0.34);
      --warm: #f2ebdd;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--night); }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 6%, rgba(201, 133, 42, 0.16), transparent 34%),
        radial-gradient(circle at 12% 86%, rgba(242, 235, 221, 0.10), transparent 30%),
        linear-gradient(145deg, var(--night) 0%, var(--night-soft) 62%, #182234 100%);
      color: var(--cream);
      font-family: Manrope, Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      border-bottom: 1px solid rgba(247, 239, 216, 0.10);
      background: rgba(24, 34, 52, 0.88);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
    }
    .header-inner {
      width: min(100%, 1280px);
      height: 76px;
      margin: 0 auto;
      padding: 0 28px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 22px;
    }
    .header-brand {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--ivory);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-decoration: none;
    }
    .header-brand img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }
    .primary-nav {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 28px;
      color: rgba(247, 239, 216, 0.76);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .primary-nav a,
    .header-cta {
      color: inherit;
      text-decoration: none;
      transition: color 160ms ease, background-color 160ms ease;
    }
    .primary-nav a:hover { color: var(--amber); }
    .header-actions {
      justify-self: end;
      display: flex;
      align-items: center;
    }
    .header-cta {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--amber);
      color: #182234;
      padding: 0 22px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .header-cta:hover { background: var(--warm); color: #182234; }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 124px 18px 48px;
    }
    .status-card {
      width: min(100%, 640px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(24, 34, 52, 0.88), rgba(17, 29, 47, 0.82));
      box-shadow: 0 24px 70px rgba(10, 16, 28, 0.28), inset 0 1px 0 rgba(247, 239, 216, 0.13);
      backdrop-filter: blur(18px) saturate(122%);
      -webkit-backdrop-filter: blur(18px) saturate(122%);
      padding: clamp(34px, 7vw, 54px);
      text-align: center;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: var(--ivory);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.32em;
    }
    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 78px;
      height: 78px;
      border: 1px solid rgba(247, 239, 216, 0.26);
      border-radius: 50%;
      background: rgba(247, 239, 216, 0.08);
    }
    .brand-mark img {
      display: block;
      width: 54px;
      height: 54px;
      object-fit: contain;
    }
    .status-symbol {
      width: 48px;
      height: 48px;
      margin: 30px auto 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      position: relative;
      background: rgba(201, 133, 42, 0.10);
    }
    .status-symbol::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      left: 20px;
      top: 20px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 8px rgba(201, 133, 42, 0.14);
    }
    .status-symbol.is-success::before {
      width: 17px;
      height: 9px;
      left: 15px;
      top: 17px;
      border-radius: 0;
      border-left: 2px solid var(--amber);
      border-bottom: 2px solid var(--amber);
      background: transparent;
      box-shadow: none;
      transform: rotate(-45deg);
    }
    .status-symbol.is-error::before {
      width: 18px;
      height: 2px;
      left: 14px;
      top: 22px;
      border-radius: 999px;
      background: var(--amber);
      box-shadow: none;
      transform: rotate(-28deg);
    }
    .kicker {
      margin: 22px 0 0;
      color: var(--amber);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 0;
      color: var(--ivory);
      font-family: "Microsoft JhengHei", "Noto Sans TC", Manrope, Inter, sans-serif;
      font-size: clamp(32px, 7vw, 46px);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.12;
    }
    .message {
      max-width: 520px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }
    .checkout-actions {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }
    .checkout-actions.is-visible { display: flex; }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 32px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }
    .button-primary {
      background: var(--amber);
      color: #182234;
      box-shadow: 0 14px 34px rgba(201, 133, 42, 0.18);
    }
    .button-primary:hover {
      background: var(--warm);
      transform: translateY(-1px);
    }
    .button-secondary {
      border: 1px solid rgba(247, 239, 216, 0.22);
      color: var(--cream);
    }
    .button-secondary:hover {
      border-color: var(--amber);
      background: rgba(247, 239, 216, 0.08);
      transform: translateY(-1px);
    }
      @media (max-width: 520px) {
      .status-card { border-radius: 24px; padding: 30px 22px; }
      .site-header { position: static; }
      .header-inner {
        height: auto;
        min-height: 72px;
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 16px 18px;
        gap: 14px;
      }
      .header-brand { font-size: 16px; letter-spacing: 0.22em; }
      .header-brand img { width: 46px; height: 46px; }
      .primary-nav { flex-wrap: wrap; justify-content: center; gap: 12px 18px; font-size: 10px; }
      .header-actions { justify-self: center; }
      main { padding-top: 34px; }
      .brand-lockup { gap: 11px; font-size: 14px; letter-spacing: 0.28em; }
      .brand-mark { width: 62px; height: 62px; }
      .brand-mark img { width: 42px; height: 42px; }
      .status-symbol { width: 44px; height: 44px; }
      .button { width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/zh-tw/" class="header-brand" aria-label="Owlnest 首頁">
        <img src="/logo2.png" alt="Owlnest">
        <span>OWLNEST</span>
      </a>
      <nav class="primary-nav" aria-label="主要導覽">
        <a href="/zh-tw/">首頁</a>
        <a href="/zh-tw/products/">產品</a>
        <a href="/zh-tw/science/">科學依據</a>
        <a href="/zh-tw/about/">關於我們</a>
        <a href="/zh-tw/contact/">聯絡我們</a>
      </nav>
      <div class="header-actions">
        <a href="/zh-tw/products/#buy" class="header-cta">購買</a>
      </div>
    </div>
  </header>
  <main>
    <section class="status-card" aria-labelledby="checkout-title">
      <div class="brand-lockup">
        <span class="brand-mark"><img src="/logo2.png" alt="Owlnest"></span>
        <span>OWLNEST</span>
      </div>
      <div id="checkout-symbol" class="status-symbol" aria-hidden="true"></div>
      <p id="checkout-kicker" class="kicker">付款確認</p>
      <h1 id="checkout-title">正在確認付款</h1>
      <p id="checkout-message" class="message">我們正在確認你的 PayPal 付款，請稍候。</p>
      <div id="checkout-actions" class="checkout-actions">
        <a href="/zh-tw/products/" class="button button-primary">回到產品頁</a>
        <a href="/zh-tw/contact/" class="button button-secondary">聯絡我們</a>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const CAPTURE_ENDPOINT = "https://khoiplqugajmybmultzs.supabase.co/functions/v1/capture-paypal-order";
      const params = new URLSearchParams(window.location.search);
      const paypalOrderId = params.get("paypal_order_id") || params.get("token");
      const symbol = document.getElementById("checkout-symbol");
      const kicker = document.getElementById("checkout-kicker");
      const title = document.getElementById("checkout-title");
      const message = document.getElementById("checkout-message");
      const actions = document.getElementById("checkout-actions");

      function showState(state, kickerText, titleText, messageText) {
        symbol.classList.toggle("is-success", state === "success");
        symbol.classList.toggle("is-error", state === "error");
        kicker.textContent = kickerText;
        title.textContent = titleText;
        message.textContent = messageText;
        actions.classList.add("is-visible");
      }

      async function captureOrder() {
        if (!paypalOrderId) {
          showState(
            "error",
            "需要付款資訊",
            "找不到付款確認資訊",
            "這個連結沒有 PayPal 訂單資訊，請回到產品頁重新嘗試。"
          );
          return;
        }

        try {
          const response = await fetch(CAPTURE_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paypal_order_id: paypalOrderId })
          });
          const data = await response.json().catch(() => ({}));

          if (response.ok && (data.status === "paid" || data.status === "already_paid" || data.status === "captured")) {
            showState(
              "success",
              "付款成功",
              "你的訂單已確認",
              "謝謝你，我們已收到 Owlnest Lume 的付款。"
            );
            return;
          }

          showState(
            "error",
            "付款尚未確認",
            "我們無法確認付款",
            "你的付款可能尚未完成，或 PayPal 沒有回傳可確認的訂單。請重新嘗試，或聯絡我們協助確認。"
          );
        } catch (_error) {
          showState(
            "error",
            "付款尚未確認",
            "我們無法確認付款",
            "你的付款可能尚未完成，或 PayPal 沒有回傳可確認的訂單。請重新嘗試，或聯絡我們協助確認。"
          );
        }
      }

      captureOrder();
    })();
  </script>
  <script src="/assets/js/consent.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>付款狀態 | Owlnest Official</title>
  <link rel="icon" type="image/png" href="/logo2.png" />
  <link rel="stylesheet" href="/assets/css/tailwind-public.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/consent.css">
  <style>
    :root {
      --midnight: #111d2f;
      --ink: #172133;
      --cream: #f7efd8;
      --ivory: #fffaf0;
      --amber: #d8912a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top, #1d2a40 0, var(--midnight) 46%, #09111f 100%);
      color: var(--ink);
      font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .status-card {
      width: min(100%, 720px);
      background: linear-gradient(180deg, var(--ivory), var(--cream));
      border: 1px solid rgba(216, 145, 42, 0.28);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
      padding: clamp(32px, 7vw, 56px);
      text-align: center;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--midnight);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.28em;
    }
    .brand-mark {
      display: inline-flex;
      width: 54px;
      height: 54px;
      align-items: center;
      justify-content: center;
      background: var(--midnight);
      border-radius: 50%;
    }
    .brand-mark img {
      display: block;
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .kicker {
      margin: 32px 0 0;
      color: #a86512;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 0;
      color: var(--midnight);
      font-family: Georgia, "Noto Serif TC", "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 58px);
      line-height: 1.05;
    }
    .message {
      max-width: 570px;
      margin: 22px auto 0;
      color: rgba(17, 29, 47, 0.78);
      font-size: 17px;
      line-height: 1.8;
    }
    .checkout-actions {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
    }
    .checkout-actions.is-visible { display: flex; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      color: #fff7e8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .button-primary { background: var(--midnight); }
    .button-primary:hover { background: #24324a; }
    .button-secondary {
      border: 1px solid rgba(17, 29, 47, 0.24);
      color: var(--midnight);
    }
    .button-secondary:hover { border-color: var(--amber); }
  </style>
</head>
<body>
  <main>
    <section class="status-card" aria-labelledby="checkout-title">
      <div class="brand-lockup">
        <span class="brand-mark"><img src="/logo2.png" alt="Owlnest"></span>
        <span>OWLNEST</span>
      </div>
      <p id="checkout-kicker" class="kicker">付款確認中</p>
      <h1 id="checkout-title">正在確認付款</h1>
      <p id="checkout-message" class="message">
        請先不要關閉此頁，我們正在確認你的 PayPal 預購付款
      </p>
      <div id="checkout-actions" class="checkout-actions">
        <a href="/zh-tw/products/" class="button button-primary">回到產品頁</a>
        <a href="/zh-tw/contact/" class="button button-secondary">聯絡我們</a>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const CAPTURE_ENDPOINT = "https://khoiplqugajmybmultzs.supabase.co/functions/v1/capture-paypal-order";
      const params = new URLSearchParams(window.location.search);
      const paypalOrderId = params.get("paypal_order_id") || params.get("token");
      const kicker = document.getElementById("checkout-kicker");
      const title = document.getElementById("checkout-title");
      const message = document.getElementById("checkout-message");
      const actions = document.getElementById("checkout-actions");

      function showState(kickerText, titleText, messageText) {
        kicker.textContent = kickerText;
        title.textContent = titleText;
        message.textContent = messageText;
        actions.classList.add("is-visible");
      }

      async function captureOrder() {
        if (!paypalOrderId) {
          showState("付款錯誤", "付款無法完成", "這個回傳連結沒有 PayPal 訂單編號。請重新嘗試，或聯絡我們協助確認");
          return;
        }

        try {
          const response = await fetch(CAPTURE_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paypal_order_id: paypalOrderId })
          });
          const data = await response.json().catch(() => ({}));

          if (response.ok && (data.status === "paid" || data.status === "already_paid" || data.status === "captured")) {
            showState("付款成功", "訂單已確認", "我們已收到你的預購付款，後續會透過 email 更新預購與出貨資訊");
            return;
          }

          const errorCode = data?.error?.message || data?.error?.code || "";
          if (errorCode === "ORDER_NOT_APPROVED") {
            showState("付款尚未完成", "PayPal 付款尚未核准", "PayPal 顯示此訂單尚未完成核准。請回到結帳流程並完成 PayPal 付款確認");
            return;
          }

          showState("付款錯誤", "付款無法完成", "你的 PayPal 付款尚未完成。請重新嘗試，或聯絡我們協助確認");
        } catch (_error) {
          showState("付款錯誤", "付款無法完成", "目前無法確認 PayPal 付款。請重新嘗試，或聯絡我們協助確認");
        }
      }

      captureOrder();
    })();
  </script>
  <script src="/assets/js/consent.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Payment Status | Owlnest Official</title>
  <link rel="icon" type="image/png" href="/logo2.png" />
  <link rel="stylesheet" href="/assets/css/tailwind-public.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/consent.css">
  <style>
    :root {
      --midnight: #111d2f;
      --ink: #172133;
      --cream: #f7efd8;
      --ivory: #fffaf0;
      --amber: #d8912a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top, #1d2a40 0, var(--midnight) 46%, #09111f 100%);
      color: var(--ink);
      font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .status-card {
      width: min(100%, 720px);
      background: linear-gradient(180deg, var(--ivory), var(--cream));
      border: 1px solid rgba(216, 145, 42, 0.28);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
      padding: clamp(32px, 7vw, 56px);
      text-align: center;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--midnight);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.28em;
    }
    .brand-mark {
      display: inline-flex;
      width: 54px;
      height: 54px;
      align-items: center;
      justify-content: center;
      background: var(--midnight);
      border-radius: 50%;
    }
    .brand-mark img {
      display: block;
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .kicker {
      margin: 32px 0 0;
      color: #a86512;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 0;
      color: var(--midnight);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 58px);
      line-height: 0.98;
    }
    .message {
      max-width: 570px;
      margin: 22px auto 0;
      color: rgba(17, 29, 47, 0.78);
      font-size: 17px;
      line-height: 1.7;
    }
    .checkout-actions {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
    }
    .checkout-actions.is-visible { display: flex; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      color: #fff7e8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .button-primary { background: var(--midnight); }
    .button-primary:hover { background: #24324a; }
    .button-secondary {
      border: 1px solid rgba(17, 29, 47, 0.24);
      color: var(--midnight);
    }
    .button-secondary:hover { border-color: var(--amber); }
  </style>
</head>
<body>
  <main>
    <section class="status-card" aria-labelledby="checkout-title">
      <div class="brand-lockup">
        <span class="brand-mark"><img src="/logo2.png" alt="Owlnest"></span>
        <span>OWLNEST</span>
      </div>
      <p id="checkout-kicker" class="kicker">Payment processing</p>
      <h1 id="checkout-title">Processing your payment...</h1>
      <p id="checkout-message" class="message">
        Please keep this page open while we confirm your PayPal preorder payment.
      </p>
      <div id="checkout-actions" class="checkout-actions">
        <a href="/products/" class="button button-primary">Back to Products</a>
        <a href="/contact/" class="button button-secondary">Contact Support</a>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const CAPTURE_ENDPOINT = "https://khoiplqugajmybmultzs.supabase.co/functions/v1/capture-paypal-order";
      const params = new URLSearchParams(window.location.search);
      const paypalOrderId = params.get("paypal_order_id") || params.get("token");
      const kicker = document.getElementById("checkout-kicker");
      const title = document.getElementById("checkout-title");
      const message = document.getElementById("checkout-message");
      const actions = document.getElementById("checkout-actions");

      function showState(kickerText, titleText, messageText) {
        kicker.textContent = kickerText;
        title.textContent = titleText;
        message.textContent = messageText;
        actions.classList.add("is-visible");
      }

      async function captureOrder() {
        if (!paypalOrderId) {
          showState(
            "Payment Error",
            "Payment could not be completed",
            "We could not find a PayPal order on this return link. Please try checkout again or contact support."
          );
          return;
        }

        try {
          const response = await fetch(CAPTURE_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paypal_order_id: paypalOrderId })
          });
          const data = await response.json().catch(() => ({}));

          if (response.ok && (data.status === "paid" || data.status === "already_paid" || data.status === "captured")) {
            showState(
              "Payment Successful",
              "Order confirmed",
              "We have received your preorder payment. We will send preorder and fulfillment updates by email."
            );
            return;
          }

          const errorCode = data?.error?.message || data?.error?.code || "";
          if (errorCode === "ORDER_NOT_APPROVED") {
            showState(
              "Payment Pending",
              "Payment has not been completed",
              "PayPal says this order has not been approved yet. Please return to checkout and complete the PayPal approval step."
            );
            return;
          }

          showState(
            "Payment Error",
            "Payment could not be completed",
            "Your PayPal payment was not completed. Please try again or contact support if the issue continues."
          );
        } catch (_error) {
          showState(
            "Payment Error",
            "Payment could not be completed",
            "We could not confirm your PayPal payment right now. Please try again or contact support."
          );
        }
      }

      captureOrder();
    })();
  </script>
  <script src="/assets/js/consent.js" defer></script>
</body>
</html>

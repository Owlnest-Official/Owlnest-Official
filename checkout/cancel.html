<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Payment Cancelled | Owlnest Official</title>
  <link rel="icon" type="image/png" href="/logo2.png" />
  <link rel="stylesheet" href="/assets/css/tailwind-public.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --midnight: #111d2f;
      --ink: #172133;
      --cream: #f7efd8;
      --ivory: #fffaf0;
      --amber: #d8912a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top, #1d2a40 0, var(--midnight) 46%, #09111f 100%);
      color: var(--ink);
      font-family: Manrope, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .status-card {
      width: min(100%, 680px);
      background: linear-gradient(180deg, var(--ivory), var(--cream));
      border: 1px solid rgba(216, 145, 42, 0.28);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
      padding: clamp(32px, 7vw, 56px);
      text-align: center;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--midnight);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.28em;
    }
    .brand-mark {
      display: inline-flex;
      width: 54px;
      height: 54px;
      align-items: center;
      justify-content: center;
      background: var(--midnight);
      border-radius: 50%;
    }
    .brand-mark img {
      display: block;
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .kicker {
      margin: 32px 0 0;
      color: #a86512;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 0;
      color: var(--midnight);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 8vw, 58px);
      line-height: 0.98;
    }
    .message {
      max-width: 560px;
      margin: 22px auto 0;
      color: rgba(17, 29, 47, 0.78);
      font-size: 17px;
      line-height: 1.7;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      min-height: 48px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--midnight);
      color: #fff7e8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .button:hover { background: #24324a; }
  </style>
</head>
<body>
  <main>
    <section class="status-card" aria-labelledby="cancel-title">
      <div class="brand-lockup">
        <span class="brand-mark"><img src="/logo2.png" alt="Owlnest"></span>
        <span>OWLNEST</span>
      </div>
      <p class="kicker">Payment cancelled</p>
      <h1 id="cancel-title">Your payment was cancelled.</h1>
      <p class="message">
        No preorder payment was completed. You can return to Products whenever you are ready.
      </p>
      <a href="/products/" class="button">Return to Products</a>
    </section>
  </main>
</body>
</html>
